services:
  anime-calendar:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - anime-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  anime-data:
